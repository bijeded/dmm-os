schema: spec-driven

context: |
  DMM OS: a single-user macOS desktop app that is the living record of the DMM Studios
  business (Contactos, Cotizaciones, Proyectos, Ingresos, Costos, AI usage). Local-first:
  one SQLite database plus the `DMM OS` folder on disk. Not accounting software: KPI-level
  money figures are enough; skip strict tax-bookkeeping cases (IEPS, per-row tax detail).

  Tech stack: Electron + electron-vite, React 19, react-router, Tailwind 4 with shadcn-style
  components, better-sqlite3 + drizzle-orm (migrations generated by drizzle-kit),
  TypeScript, Vitest run under Electron's Node, ESLint.

  Layout:
  - src/main: domain modules and IPC handlers; src/main/db (schema, migrations, test-db);
    src/main/importacion (folder scan and Facturas/CFDI runs)
  - src/shared: the IPC contract (contrato.ts) and domain types (dominio.ts)
  - src/renderer: one route per app section (Inicio, Contactos, Cotizaciones, Proyectos,
    Finanzas, Lab, AI, Configuración)

  Language:
  - Write artifacts in English, but use the domain terms from CONTEXT.md verbatim
    (Contacto, Cotización, Folio, Periodo generado, Cobros, Respaldo…) and never the
    synonyms it lists under _Avoid_
  - UI copy is Spanish
  - A new or changed domain term belongs in CONTEXT.md; a hard-to-reverse decision
    belongs in docs/adr/

  Standing decisions (docs/adr/):
  - ADR-0001: stored file locations are relative to the `DMM OS` root, never absolute
  - ADR-0002: imported history is exempt from the lifecycle guards
  - ADR-0003: migrations run with foreign keys off and are checked before commit
  - No migration runs without a Respaldo

  Conventions:
  - Money goes through the money module (src/main/dinero.ts, src/shared/montos.ts);
    amounts are MXN, a USD record keeps its original amount and rate
  - Derived facts (Estado de Contacto, Cobros, Asignación de costo, Sin ingresos
    registrados) are computed when read, never stored
  - Records with links are cancelled, not deleted (Borrar vs cancelar)

rules:
  proposal:
    - One intent, stated in a sentence; split anything that needs "and also"
    - Name the CONTEXT.md terms the change touches, and any term it introduces
    - If the change contradicts an ADR, say so and why it is worth reopening
    - Include a Non-goals section
  specs:
    - Describe what the user sees in the app or what the stored record says, not the code
    - Name capabilities after an app section or a CONTEXT.md concept, in Spanish kebab-case
      (e.g. cotizaciones, cobros, respaldo)
    - When money is involved, cover a USD record as well as an MXN one
    - When a lifecycle transition is involved, cover cancellation and imported history (ADR-0002)
    - When a derived fact is involved, state that it clears or updates once its inputs change
  design:
    - Keep domain rules in pure modules under src/main, with handlers.ts as the thin IPC layer
    - A new IPC channel is declared in src/shared/contrato.ts
    - Schema changes go through `npm run db:generate` and must survive a rebuild under ADR-0003
    - Reuse an existing module (dinero, periodos, calendario, cancelacion…) before adding a rule
  tasks:
    - Each behavior task names the test file that pins it
    - Tests that create temp folders remove them
    - End with `npm run typecheck`, `npm run lint`, and `npm test`
    - Add a task to update CONTEXT.md or write an ADR when the change resolves a term or decision
    - Add a code review task after implementation (/code-review on the branch diff), and fix
      what it confirms before the final checks
    - Add a security review task (/security-review) when the change touches a sensitive area —
      the IPC surface (src/preload, src/shared/contrato.ts, src/main/handlers.ts), Electron
      window or shell settings (src/main/index.ts), file system reads and writes or path
      resolution (rutas, carpetas, lab, importacion), external input parsing (cfdi.ts, CFDI XML,
      imported PDFs and folders), the AI module reading local files (ai.ts), or the database,
      migrations, Respaldo and Restauración (src/main/db, backup.ts)

operations:
  apply:
    guidance:
      - Run the focused test file first (`npm test -- <path>`), then the full suite
      - Keep the domain vocabulary of CONTEXT.md in identifiers and test names
  archive:
    guidance:
      - Check that CONTEXT.md and docs/adr/ reflect any term or decision the change settled
